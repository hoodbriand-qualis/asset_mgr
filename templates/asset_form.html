{% extends 'base.html' %}
{% block content %}
<section class="card">
  <h2>Add New Asset</h2>
  <form method="post" class="grid-form">
    <label>Asset ID <input type="text" name="asset_id" required></label>
    <label>Part Number <input type="text" name="part_number" required></label>
    <label>Description <input type="text" name="description" required></label>
    <label>Qualis / Program Owned <input type="text" name="ownership" required></label>
    <label>Current location <input type="text" name="location"></label>
    <label>Assigned to <input type="text" name="assigned_to"></label>
    <label>Calibration date <input type="date" name="calibration_date"></label>
    <label>Status
      <select name="status">
        {% for s in statuses %}<option value="{{ s }}">{{ s }}</option>{% endfor %}
      </select>
    </label>
    <button type="submit">Create Asset</button>
  </form>
</section>
{% endblock %}
