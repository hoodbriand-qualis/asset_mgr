{% extends 'base.html' %}
{% block content %}
<section class="card">
  <h2>Asset {{ asset.asset_id }}</h2>
  <p>
    <a href="{{ url_for('asset_qrcode', asset_id=asset.asset_id) }}">Download QR (PNG)</a> |
    <a href="{{ url_for('asset_barcode', asset_id=asset.asset_id) }}">Download Barcode (Code128 PNG, Brother QL-800 ready)</a>
  </p>
  <form method="post" action="{{ url_for('update_asset', asset_id=asset.asset_id) }}" class="grid-form">
    <label>Part Number <input type="text" name="part_number" value="{{ asset.part_number }}" {% if user.role != 'manager' %}readonly{% endif %}></label>
    <label>Description <input type="text" name="description" value="{{ asset.description }}" {% if user.role != 'manager' %}readonly{% endif %}></label>
    <label>Qualis / Program Owned <input type="text" name="ownership" value="{{ asset.ownership }}" {% if user.role != 'manager' %}readonly{% endif %}></label>
    <label>Current location <input type="text" name="location" value="{{ asset.location or '' }}"></label>
    <label>Assigned to <input type="text" name="assigned_to" value="{{ asset.assigned_to or '' }}"></label>
    <label>Calibration date <input type="date" name="calibration_date" value="{{ asset.calibration_date or '' }}"></label>
    <label>Status
      <select name="status" {% if user.role != 'manager' %}disabled{% endif %}>
        {% for s in statuses %}
          <option value="{{ s }}" {% if asset.status == s %}selected{% endif %}>{{ s }}</option>
        {% endfor %}
      </select>
    </label>
    <button type="submit">Update Asset</button>
  </form>
</section>
{% endblock %}
